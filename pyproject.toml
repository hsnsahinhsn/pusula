[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pusula-engine"
version = "1.0.0"
description = "Pusula: Sub-15 ms Typed Decision, Routing, and Triage Engine for Autonomous Turkish Agent Workflows"
readme = "README.md"
authors = [
    { name = "Hasan Şahin" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = [
    "decision-engine",
    "turkish-nlp",
    "agentic-ai",
    "routing",
    "triage",
    "low-latency",
    "pytorch",
    "fastapi"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "accelerate>=0.34.0",
    "pydantic>=2.8.0",
    "fastapi>=0.112.0",
    "uvicorn>=0.30.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "tqdm>=4.66.0",
    "datasets>=2.20.0",
    "openai>=1.40.0",
    "aiohttp>=3.10.0",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "ruff>=0.5.0"
]
export = [
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0"
]

[project.urls]
Homepage = "https://github.com/hsnsahinhsn/pusula"
Repository = "https://github.com/hsnsahinhsn/pusula"
Issues = "https://github.com/hsnsahinhsn/pusula/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
