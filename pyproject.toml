[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pusula"
version = "2.0.0"
description = "Pusula: fast, calibrated Turkish decision engine — answers choice / yes-no / score questions about any text in milliseconds"
readme = "README.md"
authors = [{ name = "Hasan Şahin" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["turkish", "nlp", "decision", "routing", "triage", "classification", "agents", "guardrails"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Turkish",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
# Inference: Python API and HTTP server
serve = [
    "torch>=2.4",
    "transformers>=4.48",
    "safetensors>=0.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# Training your own model
train = [
    "pusula[serve]",
    "accelerate>=0.34",
]
# Data generation with a local LLM (vLLM / any OpenAI-compatible server)
generate = [
    "openai>=1.40",
]
# Teacher labeling with vllm-sr/d3 (its runtime pins transformers)
teacher = [
    "transformers==5.17.0",
    "accelerate>=1.10",
    "einops",
    "pillow>=10",
    "torchvision",
    "opencv-python-headless",
]
dev = [
    "pusula[serve,generate]",
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
pusula-serve = "pusula.serve:main"

[project.urls]
Homepage = "https://github.com/hsnsahinhsn/pusula"
Repository = "https://github.com/hsnsahinhsn/pusula"
Issues = "https://github.com/hsnsahinhsn/pusula/issues"

[tool.setuptools.packages.find]
include = ["pusula*"]

[tool.setuptools.package-data]
pusula = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E9", "F", "B", "I"]
# B023: closures passed to LBFGS.step are called inside the same loop iteration.
ignore = ["B023", "B904", "B905"]
