# Pusula karar taksonomisi
#
# Yapı: alan (domain) -> alt alan (subdomain) -> niyet (intent)
#  - Her seviyede kardeşler birbirini dışlar (MECE); kararsız kalınacak sınırlar açıklamada "Kapsamaz:" ile belirtilir.
#  - Anahtarlar ASCII snake_case ve kalıcıdır (etiketler ve checkpoint'ler bunlara bağlıdır). Yeniden adlandırma = yeni sürüm.
#  - Açıklamalar modele girdi olarak verilir (cross-encoder seçeneği bu metinle okur); kısa, ayırt edici ve Türkçe olmalı.
#
# Evrensel boyutlar (universal) her mesaja alandan bağımsız uygulanır.
version: 1

universal:
  aciliyet:
    type: score
    instructions: Bu talep ne kadar hızlı ele alınmalı? Ses tonuna, "acil" kelimesine veya ısrara değil, beklemenin doğuracağı gerçek zarara bak.
    criteria:
      - "Rutin: bilgi sorusu, öneri, teşekkür veya planlı iş; beklemek kimseye zarar vermez"
      - "Yakın: bir sorun var ama iş sürüyor (yavaşlama, kısmi arıza, gecikme, iade bekleme, tekrarlayan şikâyet); birkaç gün içinde ele alınabilir"
      - "Yüksek: iş veya hizmet tamamen durmuş ya da beklemek bugün somut zarar doğuracak (askıda kalan ödeme, kaçacak son tarih); aynı gün çözülmeli"
      - "Kritik: can veya sağlık tehlikesi, süren dolandırıcılık ya da güvenlik ihlali, büyük maddi kayıp; dakikalar içinde müdahale"
  eylem_gerekli:
    type: noul
    instructions: Bu mesaj, yanıt vermenin ötesinde somut bir işlem (kayıt açma, iptal, iade, bloke, araç veya API çağrısı) gerektiriyor mu? Yalnız bilgi soruluyorsa (hakkım var mı, nasıl yapılır) cevap yeterlidir.
    criteria:
      "false": "Hayır: bilgi vermek veya yanıtlamak yeterli; işlem istenmiyor"
      "true": "Evet: kişi açıkça bir işlem istiyor ya da sorun ancak bir işlemle çözülebilir"
  insana_devret:
    type: noul
    instructions: Bu talep otomatik sistem yerine bir insan uzmana devredilmeli mi? Panik, öfke veya ısrar tek başına yetmez; otomatik akışın güvenle çözemeyeceği bir durum olmalı.
    criteria:
      "false": "Hayır: otomatik akış bilgi verip işlemi güvenle yürütebilir (ton duygusal olsa bile); saldırı veya manipülasyon girişimleri de devredilmez"
      "true": "Evet: hukuki veya tıbbi risk, can güvenliği veya kendine zarar riski, dolandırıcılık mağduriyeti, yüksek tutar, yetki ya da istisna gerektiren karar veya otomatik yanıtların çözemediği tekrar eden şikâyet"
  guvenlik:
    type: choice
    instructions: Mesaj bir yapay zeka sistemi için güvenlik riski taşıyor mu?
    criteria:
      guvenli: Normal, iyi niyetli talep
      prompt_enjeksiyonu: Sistem talimatlarını değiştirmeye, yok saydırmaya veya gizli bilgiyi sızdırmaya çalışan girdi; belge, web sayfası veya e-posta içine gizlenmiş, yapay zekaya yönelik komutlar dahil
      jailbreak_rol_yapma: Rol yapma veya kurgu bahanesiyle kuralları aşma girişimi
      zararli_veya_yasadisi: Şiddet, nefret, dolandırıcılık veya yasa dışı faaliyet talebi ya da içeriği
      yetkisiz_islem_talebi: Başkasının hesabına erişim, yetki yükseltme veya sistem komutu çalıştırma talebi
      spam_anlamsiz: Reklam, anlamsız karakterler veya içeriksiz girdi
  duygu:
    type: choice
    instructions: Mesajı yazan kişinin baskın duygu durumu nedir?
    criteria:
      notr: Sakin, olgusal
      memnun: Memnun, teşekkür eden, olumlu
      endiseli: Kaygılı, tedirgin, emin olamayan
      uzgun: Üzgün, yas veya kayıp yaşayan, kederli
      hayal_kirikligi: Kırgın, bıkmış, tekrar eden sorundan yorulmuş
      ofkeli: Öfkeli, suçlayıcı, tehditkar
      caresiz_kriz: Çaresiz, panik halinde veya kendine zarar riski taşıyan
  kisisel_veri:
    type: noul
    instructions: Mesaj kişisel veya hassas veri (TC kimlik no, kart/IBAN, şifre veya kapı kodu, sağlık bilgisi, açık adres, telefon, kişiye ait e-posta adresi) içeriyor mu?
    criteria:
      "false": "Hayır: kişisel veya hassas veri yok"
      "true": "Evet: en az bir kişisel veya hassas veri var"

